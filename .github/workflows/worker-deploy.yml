name: worker-deploy

# worker 部署 + D1 迁移自动化（#420）。
# 触发：推 v* tag（随发布走）或手动 workflow_dispatch。
# 凭据用 CI secret（CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID）而非本机
# wrangler-accounts profile，放在 GitHub Environment worker-prod 里。
#
# 迁移 ↔ 代码顺序守卫：串行跑 migrate → verify:remote-schema → deploy，
# schema 校验失败即中断，绝不进 deploy（见 worker/scripts/deploy-ci.mjs）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

# 与 worker-rollback 共用一个并发组，串行化对线上的写操作，杜绝部署/回滚打架。
concurrency:
  group: worker-live-ops
  cancel-in-progress: false

jobs:
  # 迁移编号守卫（快）。release.yml 的全量门禁也跑，这里独立再跑一次，
  # 保证本 workflow 单独 dispatch 时也有守卫。
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/bun-install
      - run: bun scripts/check-migration-numbering.ts

  deploy:
    needs: guard
    runs-on: ubuntu-latest
    # GitHub Environment 提供 prod 的 Cloudflare 凭据 + smoke token。
    environment: worker-prod
    steps:
      - uses: actions/checkout@v7
        with:
          # 部署元数据要写真实 commit；deploy-ci.mjs 读 git HEAD。
          fetch-depth: 0
      - uses: ./.github/actions/bun-install
      - name: deploy prod
        working-directory: worker
        env:
          CI: "1"
          # 原生 wrangler（worker devDependency），凭 CF env 认证，非 wrangler-accounts profile。
          AGENTPARTY_WRANGLER_BIN: "bunx wrangler"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # 写路径冒烟用的一次性 token；未配置时 deploy-ci 只跑只读健康校验并跳过写冒烟。
          AGENTPARTY_SMOKE_TOKEN: ${{ secrets.AGENTPARTY_SMOKE_TOKEN }}
          AGENTPARTY_SMOKE_WRITE_TOKEN: ${{ secrets.AGENTPARTY_SMOKE_WRITE_TOKEN }}
          # runtime-peers 需要 agent 身份；部署前验凭证，部署后用双 socket 验 live topology。频道留空时自动选。
          AGENTPARTY_RUNTIME_SMOKE_TOKEN: ${{ secrets.AGENTPARTY_RUNTIME_SMOKE_TOKEN }}
          AGENTPARTY_RUNTIME_SMOKE_CHANNEL: ${{ vars.AGENTPARTY_RUNTIME_SMOKE_CHANNEL }}
        run: node scripts/deploy-ci.mjs prod

